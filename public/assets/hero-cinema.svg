<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="A glowing cinema screen framed by red velvet curtains, with theater seats, popcorn and a clapperboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1430"/>
      <stop offset="1" stop-color="#0b0810"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1d6e"/>
      <stop offset=".45" stop-color="#c2407a"/>
      <stop offset=".8" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset=".6" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset=".5" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c0a14"/>
      <stop offset=".25" stop-color="#b3132b"/>
      <stop offset=".5" stop-color="#6e0c19"/>
      <stop offset=".75" stop-color="#c41a33"/>
      <stop offset="1" stop-color="#5c0a14"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff2b3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1424"/>
      <stop offset="1" stop-color="#2a060c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="800" height="520" rx="28"/></clipPath>
    <clipPath id="screenClip"><rect x="200" y="96" width="400" height="230" rx="6"/></clipPath>
    <path id="spark" d="M0 -10 C1.5 -2 2 -1.5 10 0 C2 1.5 1.5 2 0 10 C-1.5 2 -2 1.5 -10 0 C-2 -1.5 -1.5 -2 0 -10 Z"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="520" fill="url(#bg)"/>

    <!-- Screen glow -->
    <rect x="200" y="96" width="400" height="230" fill="#ff9f43" opacity=".55" filter="url(#glow)"/>

    <!-- Movie on screen: sunset over mountains -->
    <g clip-path="url(#screenClip)">
      <rect x="200" y="96" width="400" height="230" fill="url(#sky)"/>
      <g fill="#fff" opacity=".8">
        <circle cx="240" cy="120" r="1.5"/><circle cx="300" cy="140" r="1"/><circle cx="350" cy="112" r="1.3"/>
        <circle cx="470" cy="125" r="1.2"/><circle cx="530" cy="110" r="1.6"/><circle cx="575" cy="145" r="1"/>
      </g>
      <circle cx="400" cy="268" r="62" fill="url(#sun)"/>
      <path d="M200 326 L200 262 L262 214 L310 250 L368 196 L430 254 L478 222 L540 262 L600 236 L600 326 Z" fill="#4a1d5e"/>
      <path d="M200 326 L200 290 L250 266 L300 288 L352 258 L410 292 L470 270 L530 296 L600 274 L600 326 Z" fill="#26103a"/>
      <path d="M200 326 L600 326 L600 310 C520 300 460 316 400 306 C330 296 270 316 200 304 Z" fill="#14081f"/>
    </g>
    <rect x="200" y="96" width="400" height="230" rx="6" fill="none" stroke="url(#gold)" stroke-width="7"/>

    <!-- Spotlight beams -->
    <path d="M112 0 L150 0 L330 330 L230 330 Z" fill="url(#beam)" opacity=".45"/>
    <path d="M650 0 L688 0 L570 330 L470 330 Z" fill="url(#beam)" opacity=".45"/>

    <!-- Curtains -->
    <path d="M0 40 L196 40 C170 150 150 260 178 380 C186 420 170 470 150 520 L0 520 Z" fill="url(#curtain)"/>
    <path d="M800 40 L604 40 C630 150 650 260 622 380 C614 420 630 470 650 520 L800 520 Z" fill="url(#curtain)"/>
    <g stroke="#3d0610" stroke-width="3" opacity=".55" fill="none">
      <path d="M48 40 C44 200 40 360 46 520"/><path d="M104 40 C100 200 92 360 98 520"/><path d="M152 40 C140 180 126 330 134 520"/>
      <path d="M752 40 C756 200 760 360 754 520"/><path d="M696 40 C700 200 708 360 702 520"/><path d="M648 40 C660 180 674 330 666 520"/>
    </g>
    <!-- Curtain tie-backs -->
    <rect x="128" y="300" width="58" height="12" rx="6" fill="url(#gold)" transform="rotate(-8 157 306)"/>
    <rect x="614" y="300" width="58" height="12" rx="6" fill="url(#gold)" transform="rotate(8 643 306)"/>

    <!-- Valance -->
    <path d="M0 0 H800 V44 Q780 70 760 44 Q740 70 720 44 Q700 70 680 44 Q660 70 640 44 Q620 70 600 44 Q580 70 560 44 Q540 70 520 44 Q500 70 480 44 Q460 70 440 44 Q420 70 400 44 Q380 70 360 44 Q340 70 320 44 Q300 70 280 44 Q260 70 240 44 Q220 70 200 44 Q180 70 160 44 Q140 70 120 44 Q100 70 80 44 Q60 70 40 44 Q20 70 0 44 Z" fill="#8e1023"/>
    <rect x="0" y="36" width="800" height="5" fill="url(#gold)"/>

    <!-- Audience silhouettes and back row -->
    <g fill="#3a2a4a">
      <circle cx="292" cy="392" r="17"/><path d="M262 430 C262 408 322 408 322 430 Z"/>
      <circle cx="486" cy="388" r="19"/><path d="M452 430 C452 404 520 404 520 430 Z"/>
      <circle cx="560" cy="396" r="15"/><path d="M534 430 C534 412 586 412 586 430 Z"/>
    </g>
    <g fill="url(#seat)">
      <rect x="150" y="414" width="70" height="60" rx="14"/><rect x="228" y="414" width="70" height="60" rx="14"/>
      <rect x="306" y="414" width="70" height="60" rx="14"/><rect x="384" y="414" width="70" height="60" rx="14"/>
      <rect x="462" y="414" width="70" height="60" rx="14"/><rect x="540" y="414" width="70" height="60" rx="14"/>
    </g>
    <!-- Front row -->
    <g fill="#3a0812">
      <rect x="40" y="462" width="92" height="80" rx="16"/><rect x="142" y="462" width="92" height="80" rx="16"/>
      <rect x="244" y="462" width="92" height="80" rx="16"/><rect x="346" y="462" width="92" height="80" rx="16"/>
      <rect x="448" y="462" width="92" height="80" rx="16"/><rect x="550" y="462" width="92" height="80" rx="16"/>
      <rect x="652" y="462" width="92" height="80" rx="16"/>
    </g>
    <g fill="#6b1020" opacity=".7">
      <rect x="48" y="468" width="76" height="8" rx="4"/><rect x="150" y="468" width="76" height="8" rx="4"/>
      <rect x="252" y="468" width="76" height="8" rx="4"/><rect x="354" y="468" width="76" height="8" rx="4"/>
      <rect x="456" y="468" width="76" height="8" rx="4"/><rect x="558" y="468" width="76" height="8" rx="4"/>
      <rect x="660" y="468" width="76" height="8" rx="4"/>
    </g>

    <!-- Popcorn -->
    <g transform="translate(58 352)">
      <g fill="#fff4d6" stroke="#e8c98a" stroke-width="1.5">
        <circle cx="12" cy="22" r="13"/><circle cx="32" cy="12" r="14"/><circle cx="54" cy="10" r="14"/>
        <circle cx="74" cy="20" r="13"/><circle cx="24" cy="2" r="11"/><circle cx="46" cy="-6" r="12"/><circle cx="66" cy="2" r="11"/>
      </g>
      <path d="M0 26 L86 26 L76 132 L10 132 Z" fill="#fff"/>
      <path d="M12 26 L24 26 L26 132 L18 132 Z M38 26 L50 26 L48 132 L40 132 Z M62 26 L74 26 L66 132 L58 132 Z" fill="#d7263d"/>
      <rect x="-2" y="22" width="90" height="10" rx="3" fill="url(#gold)"/>
    </g>

    <!-- Clapperboard -->
    <g transform="translate(640 372)">
      <rect x="0" y="34" width="122" height="84" rx="6" fill="#16131c" stroke="#2c2836" stroke-width="2"/>
      <rect x="12" y="56" width="98" height="4" rx="2" fill="#f5c518" opacity=".8"/>
      <rect x="12" y="72" width="70" height="4" rx="2" fill="#fff" opacity=".35"/>
      <rect x="12" y="88" width="84" height="4" rx="2" fill="#fff" opacity=".35"/>
      <rect x="0" y="16" width="122" height="18" fill="#16131c"/>
      <path d="M8 16 L26 16 L14 34 L-4 34 Z M44 16 L62 16 L50 34 L32 34 Z M80 16 L98 16 L86 34 L68 34 Z" fill="#fff" transform="translate(4 0)"/>
      <g transform="rotate(-16 0 14)">
        <rect x="0" y="-4" width="122" height="18" fill="#16131c"/>
        <path d="M12 -4 L30 -4 L18 14 L0 14 Z M48 -4 L66 -4 L54 14 L36 14 Z M84 -4 L102 -4 L90 14 L72 14 Z" fill="#f5c518"/>
      </g>
      <circle cx="3" cy="16" r="4" fill="url(#gold)"/>
    </g>

    <!-- Sparkles -->
    <g fill="#ffe680">
      <use href="#spark" transform="translate(250 72) scale(.9)"/>
      <use href="#spark" transform="translate(560 70) scale(1.2)"/>
      <use href="#spark" transform="translate(632 360) scale(.7)"/>
      <use href="#spark" transform="translate(196 350) scale(.8)"/>
      <use href="#spark" transform="translate(408 70) scale(.6)"/>
    </g>
  </g>
</svg>
