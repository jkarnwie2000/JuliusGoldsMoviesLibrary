<svg xmlns="http://www.w3.org/2000/svg" width="330" height="80" viewBox="0 0 330 80" role="img" aria-label="Julius Gold's Movies Library">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset=".5" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <!-- Emblem: gold film reel with play button on a black badge -->
  <rect x="4" y="6" width="68" height="68" rx="16" fill="#111"/>
  <circle cx="38" cy="40" r="25" fill="url(#gold)"/>
  <circle cx="38" cy="40" r="25" fill="none" stroke="#fff3b0" stroke-opacity=".6" stroke-width="1.5"/>
  <g fill="#111">
    <circle cx="38" cy="25" r="5.5"/>
    <circle cx="52.3" cy="35.4" r="5.5"/>
    <circle cx="46.8" cy="52.1" r="5.5"/>
    <circle cx="29.2" cy="52.1" r="5.5"/>
    <circle cx="23.7" cy="35.4" r="5.5"/>
  </g>
  <path d="M34.5 34.5 L44.5 40 L34.5 45.5 Z" fill="#111"/>
  <!-- Wordmark -->
  <text x="86" y="42" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="36" fill="#111" textLength="224" lengthAdjust="spacingAndGlyphs">Julius Gold’s</text>
  <text x="87" y="64" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#b8860b" textLength="222" lengthAdjust="spacing">MOVIES LIBRARY</text>
</svg>
